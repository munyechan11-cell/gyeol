services:
  # ===== ① API 서버 (Express, server.ts) — Web Service =====
  - type: web
    name: gyeol-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: SERVE_STATIC
        value: "false"              # ← 정적 파일 서빙 OFF (Static Site 가 담당)
      - key: APP_URL
        fromContext: instanceUrl
      - key: ALLOWED_ORIGINS
        sync: false                  # ← Static Site URL 을 여기 등록 (예: https://gyeol-app.onrender.com)
      # ===== Render 대시보드에서 값 직접 입력 =====
      # 데이터베이스 — 이 둘이 없으면 서버가 모든 DB 라우트에 503 을 돌려준다.
      # (조용히 빈 결과를 주지 않는다 — 설정 누락과 데이터 없음은 다른 상태다.)
      - key: SUPABASE_URL
        sync: false                  # ← https://<ref>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                  # ← ⚠️ 비밀 키. RLS 를 우회한다. 서버에만 둘 것
      # FCM 푸시 — Firebase 에 남은 유일한 기능. Firestore 는 더 이상 쓰지 않는다.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # 소셜 로그인 — 서버가 공급자에게 직접 확인한 뒤 Supabase 세션을 발급한다.
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false                  # ← 선택. 넣으면 구글 액세스 토큰의 aud 까지 확인해
                                     #   다른 앱에 발급된 토큰의 재사용을 막는다
      - key: FOODTECH_API_KEY
        sync: false
      - key: FOODTECH_API_URL
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_RESERVATION_KEY
        sync: false                  # ← AI 전화 예약 두뇌 보호용 공유키 (.env 와 동일 값, 음성채널 x-ai-key)
      - key: ZERNIO_API_KEY
        sync: false                  # ← 마케팅 인스타 발행(Zernio) API 키 (sk_...). 결 플랫폼 공용
      - key: CRON_SECRET
        sync: false                  # ← 마케팅 크론 인증용 (Cron 서비스와 동일 값)

  # ===== ② React SPA — Static Site (자동 글로벌 CDN, 무료) =====
  - type: web
    name: gyeol-app
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build:static
    staticPublishPath: ./dist
    # SPA 라우팅: 모든 경로를 index.html 로 (React Router 가 처리)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Vite 가 가져갈 환경변수 (VITE_ prefix)
    envVars:
      - key: VITE_API_URL
        sync: false                  # ← API 서비스 URL 등록 (예: https://gyeol-api.onrender.com)
      # Supabase — 여기 들어가는 건 **공개용 키**다. 번들에 포함되는 게 정상이고,
      # 이 키로 할 수 있는 일은 RLS 가 허용하는 범위뿐이다.
      # service_role 키는 절대 VITE_ 로 넣지 말 것 — 번들에 박혀 전부에게 공개된다.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # FCM 웹 푸시용. 데이터와는 무관하다.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FCM_VAPID_KEY
        sync: false
      # 문자 발송(Send SMS Hook)을 붙인 뒤 "true" 로. 그 전에는 켜지 말 것 —
      # 켜면 모든 사용자가 들어올 때마다 오지 않을 인증번호를 요구받는다.
      - key: VITE_PHONE_OTP_ENABLED
        sync: false

  # ===== 마케팅 자동화 =====
  # Render Cron(유료) 대신 무료 외부 cron(cron-job.org 등)이 매일
  #   POST $API_URL/api/cron/marketing  (헤더 x-cron-secret: $CRON_SECRET)
  # 을 호출한다. 필요한 건 위 gyeol-api 의 CRON_SECRET 환경변수뿐.
