# 결 Render 배포 명세.
#
# ⚠️ 현재 두 서비스는 이 Blueprint 로 만들어진 게 아니라 대시보드에서 직접
#    생성됐다. 그래서 이 파일은 "이렇게 배포돼 있다"는 기록이지, 이 파일을
#    고친다고 운영 설정이 바뀌지는 않는다. 환경변수는 대시보드에서 넣어야 한다.
#    아래 이름·리전·URL 은 2026-09-11 기준 실제 배포와 맞춰 둔 것이다.
#
# 실제 주소 (여기가 어긋나면 앱의 모든 API 호출이 조용히 죽는다):
#   API 서버  https://gyeol.onrender.com        ← 서비스 이름이 'gyeol' 이다
#   앱        https://gyeol-app.onrender.com
#
# 없는 주소로 요청하면 Render 가 "Not Found" 를 돌려주는데 그 응답에는 CORS
# 헤더가 없다. 브라우저에는 원인이 안 드러나고 "Failed to fetch" 로만 보인다.

services:
  # ===== ① API 서버 (Express) — Web Service =====
  #   https://gyeol.onrender.com
  - type: web
    name: gyeol
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: SERVE_STATIC
        value: "false"              # ← 정적 파일 서빙 OFF (Static Site 가 담당)
      - key: APP_URL
        fromContext: instanceUrl
      - key: ALLOWED_ORIGINS
        sync: false                  # ← https://gyeol-app.onrender.com  (콤마구분, 끝 슬래시 금지)
                                     #   문자열 정확 일치로 비교한다(server/app.ts). 슬래시 하나만
                                     #   달라도 막힌다. 비워두면 모든 출처를 허용한다.
      - key: APP_ORIGIN
        sync: false                  # ← 앱(Static Site) 출처. 소셜 로그인 팝업이 토큰을 이 출처에만 넘긴다.
                                     #   비우면 ALLOWED_ORIGINS 의 첫 항목을 쓴다
      - key: MASTER_PASSWORD
        sync: false                  # ← 마스터 화면 비밀번호(초기값). 마스터 화면에서 바꾸면 DB(app_secrets)가 우선.
                                     #   비우면 마스터 화면이 열리지 않는다 — 기본값은 없다
      # ===== Render 대시보드에서 값 직접 입력 =====
      # 데이터베이스 — 이 둘이 없으면 서버가 모든 DB 라우트에 503 을 돌려준다.
      # (조용히 빈 결과를 주지 않는다 — 설정 누락과 데이터 없음은 다른 상태다.)
      - key: SUPABASE_URL
        sync: false                  # ← https://<ref>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                  # ← ⚠️ 비밀 키. RLS 를 우회한다. 서버에만 둘 것
      # FCM 푸시 — Firebase 에 남은 유일한 기능. Firestore 는 더 이상 쓰지 않는다.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # 소셜 로그인 — 서버가 공급자에게 직접 확인한 뒤 Supabase 세션을 발급한다.
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false                  # ← 선택. 넣으면 구글 액세스 토큰의 aud 까지 확인해
                                     #   다른 앱에 발급된 토큰의 재사용을 막는다
      - key: FOODTECH_API_KEY
        sync: false
      - key: FOODTECH_API_URL
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_RESERVATION_KEY
        sync: false                  # ← AI 전화 예약 두뇌 보호용 공유키 (.env 와 동일 값, 음성채널 x-ai-key)
      - key: ZERNIO_API_KEY
        sync: false                  # ← 마케팅 인스타 발행(Zernio) API 키 (sk_...). 결 플랫폼 공용
      - key: CRON_SECRET
        sync: false                  # ← 마케팅 크론 인증용 (Cron 서비스와 동일 값)

  # ===== ② React SPA — Static Site (자동 글로벌 CDN, 무료) =====
  #   https://gyeol-app.onrender.com
  - type: web
    name: gyeol-app
    runtime: static
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build:static
    staticPublishPath: ./dist
    # SPA 라우팅: 모든 경로를 index.html 로 (React Router 가 처리)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Vite 가 가져갈 환경변수 (VITE_ prefix)
    envVars:
      - key: VITE_API_URL
        sync: false                  # ← https://gyeol.onrender.com  (예시 아님, 이 값 그대로)
                                     #   VITE_ 변수는 빌드 시점에 번들에 박힌다. 값을 바꾸면
                                     #   반드시 이 Static Site 를 재빌드해야 반영된다.
      # Supabase — 여기 들어가는 건 **공개용 키**다. 번들에 포함되는 게 정상이고,
      # 이 키로 할 수 있는 일은 RLS 가 허용하는 범위뿐이다.
      # service_role 키는 절대 VITE_ 로 넣지 말 것 — 번들에 박혀 전부에게 공개된다.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # FCM 웹 푸시용. 데이터와는 무관하다.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FCM_VAPID_KEY
        sync: false
      # 문자 발송(Send SMS Hook)을 붙인 뒤 "true" 로. 그 전에는 켜지 말 것 —
      # 켜면 모든 사용자가 들어올 때마다 오지 않을 인증번호를 요구받는다.
      - key: VITE_PHONE_OTP_ENABLED
        sync: false

  # ===== 마케팅 자동화 =====
  # Render Cron(유료) 대신 무료 외부 cron(cron-job.org 등)이 매일
  #   POST $API_URL/api/cron/marketing  (헤더 x-cron-secret: $CRON_SECRET)
  # 을 호출한다. 필요한 건 위 gyeol 의 CRON_SECRET 환경변수뿐.
